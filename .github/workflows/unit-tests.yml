name: Unit Tests

# Runs on every push to any branch EXCEPT main/staging (those are covered
# by pr-checks.yml + the deploy workflows). Fast feedback loop while coding.
on:
  push:
    branches-ignore:
      - main
      - staging

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests (web + api + shared)
        run: pnpm turbo run test

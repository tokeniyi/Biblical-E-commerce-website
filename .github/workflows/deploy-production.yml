name: Deploy Production

# Runs after code lands on main. The "production" environment below should
# have a required reviewer configured in GitHub repo Settings > Environments
# - that gives you a manual approval gate before anything actually deploys,
# even though the workflow itself triggers automatically.
on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web

  migrate-and-deploy-api:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations against production Neon
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      # Keep this as a separate Railway service from staging - not the
      # same service with different env vars - that's how staging traffic
      # ends up hitting production by accident.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (production service)
        run: railway up --service=${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

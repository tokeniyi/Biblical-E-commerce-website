name: Deploy Production

# Runs after code lands on main. The "production" environment below should
# have a required reviewer configured in GitHub repo Settings > Environments
# - that gives you a manual approval gate before anything actually deploys,
# even though the workflow itself triggers automatically.
on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  migrate-and-deploy-api:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations against production Neon
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      # Mirror whichever provider you enabled in deploy-staging.yml here,
      # pointed at production secrets/service IDs. Keep staging and
      # production as separate Fly apps / Railway services, not the same
      # one with different env vars - that's how staging traffic ends up
      # hitting production by accident.

      - name: Deploy API (uncomment your chosen provider)
        run: echo "Mirror the staging deploy step, pointed at production"
